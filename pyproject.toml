[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driftlens"
version = "1.0.0"
description = "Educational ML-reliability auditor under temporal data shift"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.2", "streamlit>=1.30"]

[tool.setuptools]
packages = ["driftlens"]
